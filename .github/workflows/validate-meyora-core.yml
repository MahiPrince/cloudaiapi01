name: Validate Meyora Core
on:
  push:
    branches: [main, meyora-core-v1, meyora-v4.6-backend]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py meyora_core.py meyora_attachments.py
      - name: Attachment ingestion tests
        run: python tests/test_meyora_attachments.py
      - name: Session domain schema tests
        run: python tests/test_v46_session_schema.py
      - name: Admin JavaScript syntax
        run: node --check static/admin.js
