name: Validate Meyora Core
on:
  push:
    branches: [meyora-core-v1]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile app.py meyora_core.py
      - name: Admin JavaScript syntax
        run: node --check static/admin.js
