<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <title>CMD Sally Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-row"><div class="brand-mark small">S</div><div><strong>CMD Sally</strong><span>ADMIN</span></div></div>
    <nav id="nav">
      <button data-page="overview" class="active">Overview</button>
      <div class="nav-label">OPERATIONS</div>
      <button data-page="requests">Requests</button>
      <button data-page="salesforce">Salesforce</button>
      <button data-page="sessions">Sessions</button>
      <button data-page="deleted">Deleted Sessions</button>
      <button data-page="errors">Errors</button>
      <div class="nav-label">CONFIGURATION</div>
      <button data-page="workflows">Workflows</button>
      <button data-page="jargon">Jargon</button>
      <button data-page="knowledge">Knowledge</button>
      <button data-page="capabilities">Capabilities</button>
      <div class="nav-label">SYSTEM</div>
      <button data-page="usage">Usage</button>
    </nav>
    <form method="post" action="{{ url_for('admin_logout') }}"><button class="logout-button">Log out</button></form>
  </aside>
  <main class="content">
    <header class="topbar">
      <div><div class="eyebrow" id="pageEyebrow">CMD SALLY</div><h1 id="pageTitle">Overview</h1></div>
      <div class="top-actions"><span class="admin-user">{{ admin_username }}</span><button id="refreshButton" class="ghost-button">Refresh</button></div>
    </header>
    <section id="page" class="page"></section>
  </main>
</div>
<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
