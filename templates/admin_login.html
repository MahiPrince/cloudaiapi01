<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CMD Sally Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand-mark">S</div>
    <div class="eyebrow">CMD SALLY</div>
    <h1>Admin Console</h1>
    <p class="muted">Demo operations, workflows, client jargon and system controls.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if not configured %}
      <div class="alert warning">
        Admin is disabled until <code>ADMIN_USERNAME</code>, <code>ADMIN_PASSWORD</code> and <code>ADMIN_SESSION_SECRET</code> are configured in Render.
      </div>
    {% else %}
    <form method="post" action="{{ url_for('admin_login_post') }}" class="login-form">
      <label>Username<input name="username" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
